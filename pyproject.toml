[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowcannery"
version = "0.2.0"
description = "带规则预设和书籍插件的扫描复习指南题库构建工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "PyMuPDF>=1.24,<2"]

[project.scripts]
meowcannery = "meowcannery.cli:main"

[tool.setuptools.packages.find]
include = ["meowcannery*", "plugins*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
